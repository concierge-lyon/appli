<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sélection du Concierge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0f1f3d;
      --blue: #1a56a0;
      --sky: #3b82f6;
      --gold: #c9a84c;
      --cream: #f8f6f1;
      --white: #ffffff;
      --gray: #6b7280;
      --light: #e8edf5;
      --shadow: 0 4px 24px rgba(15,31,61,0.13);
      --radius: 14px;
    }

    html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--cream); }

    /* ===== HEADER ===== */
    #header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: var(--navy);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
      height: 60px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.25);
    }
    #header .logo {
      display: flex; align-items: center; gap: 10px;
    }
    #header .logo-icon {
      width: 32px; height: 32px;
      background: var(--gold);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    #header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      color: var(--white);
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    #header .subtitle {
      font-size: 11px;
      color: var(--gold);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 300;
    }

    /* ===== FILTER BAR ===== */
    #filters {
      position: fixed; top: 60px; left: 0; right: 0; z-index: 999;
      background: var(--white);
      border-bottom: 1px solid var(--light);
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      box-shadow: 0 2px 10px rgba(15,31,61,0.07);
    }
    #filters::-webkit-scrollbar { display: none; }

    .filter-btn {
      display: flex; align-items: center; gap: 7px;
      padding: 7px 16px;
      border-radius: 30px;
      border: 1.5px solid transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      background: var(--light);
      color: var(--navy);
    }
    .filter-btn .dot {
      width: 10px; height: 10px; border-radius: 50%;
    }
    .filter-btn.active { color: var(--white); }
    .filter-btn[data-cat="tous"].active { background: var(--navy); border-color: var(--navy); }
    .filter-btn[data-cat="culture"].active { background: #1a56a0; border-color: #1a56a0; }
    .filter-btn[data-cat="patrimoine"].active { background: #166534; border-color: #166534; }
    .filter-btn[data-cat="etoiles"].active { background: #b8860b; border-color: #b8860b; }
    .filter-btn[data-cat="restaurants"].active { background: #991b1b; border-color: #991b1b; }
    .filter-btn[data-cat="halles"].active { background: #0ea5e9; border-color: #0ea5e9; }
    .filter-btn[data-cat="transports"].active { background: #374151; border-color: #374151; }
    .filter-btn:not(.active):hover { border-color: var(--navy); }

    /* ===== MAP ===== */
    #map {
      position: fixed;
      top: 108px; left: 0; right: 0; bottom: 0;
      z-index: 1;
    }

    /* ===== POPUP ===== */
    .leaflet-popup-content-wrapper {
      border-radius: var(--radius) !important;
      box-shadow: var(--shadow) !important;
      padding: 0 !important;
      overflow: hidden;
      border: none !important;
      min-width: 240px;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      width: auto !important;
    }
    .leaflet-popup-tip-container { margin-top: -1px; }

    .popup-inner {
      font-family: 'DM Sans', sans-serif;
    }
    .popup-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--light);
    }
    .popup-category {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .popup-name {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--navy);
      line-height: 1.3;
    }
    .popup-body {
      padding: 10px 16px 14px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .popup-row {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: 12.5px; color: var(--gray);
      line-height: 1.5;
    }
    .popup-row svg { flex-shrink: 0; margin-top: 2px; }
    .popup-note {
      font-size: 12px;
      color: var(--navy);
      font-style: italic;
      background: var(--light);
      border-left: 3px solid var(--gold);
      padding: 7px 10px;
      border-radius: 0 6px 6px 0;
      margin-top: 4px;
    }

    /* ===== MY LOCATION ===== */
    .my-location-marker {
      width: 18px; height: 18px;
      background: var(--sky);
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(59,130,246,0.25);
    }

    /* ===== LEGEND ===== */
    #legend {
      position: fixed;
      bottom: 20px; right: 16px;
      z-index: 999;
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px 16px;
      font-size: 12px;
      color: var(--navy);
      display: flex; flex-direction: column; gap: 6px;
    }
    .legend-title {
      font-family: 'Playfair Display', serif;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 2px;
    }
    .legend-row {
      display: flex; align-items: center; gap: 8px;
    }
    .legend-dot {
      width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
    }

    /* ===== USER LOCATION BTN ===== */
    #geoBtn {
      position: fixed;
      bottom: 20px; left: 16px;
      z-index: 999;
      background: var(--navy);
      color: white;
      border: none;
      border-radius: 50%;
      width: 46px; height: 46px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: var(--shadow);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    #geoBtn:hover { background: var(--blue); }

  </style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div class="logo">
    <div class="logo-icon">🗺️</div>
    <div>
      <h1>Sélection du Concierge</h1>
    </div>
  </div>
</div>

<!-- FILTRES -->
<div id="filters">
  <button class="filter-btn active" data-cat="tous"><span>✦</span> Tout afficher</button>
  <button class="filter-btn" data-cat="culture"><span class="dot" style="background:#1a56a0"></span> Culture & Musées</button>
  <button class="filter-btn" data-cat="patrimoine"><span class="dot" style="background:#166534"></span> Traboules & Patrimoine</button>
  <button class="filter-btn" data-cat="etoiles"><span class="dot" style="background:#b8860b"></span> ⭐ Étoilés Michelin</button>
  <button class="filter-btn" data-cat="restaurants"><span class="dot" style="background:#991b1b"></span> 🍽️ Restaurants</button>
  <button class="filter-btn" data-cat="halles"><span class="dot" style="background:#0ea5e9"></span> 🏛️ Halles Paul Bocuse</button>
  <button class="filter-btn" data-cat="transports"><span class="dot" style="background:#374151"></span> 🚇 Transports</button>
</div>

<!-- MAP -->
<div id="map"></div>

<!-- BOUTON GÉOLOCALISATION -->
<button id="geoBtn" title="Ma position">📍</button>

<!-- LÉGENDE -->
<div id="legend">
  <div class="legend-title">Légende</div>
  <div class="legend-row"><div class="legend-dot" style="background:#1a56a0"></div> Culture & Musées</div>
  <div class="legend-row"><div class="legend-dot" style="background:#166534"></div> Traboules & Patrimoine</div>
  <div class="legend-row"><div class="legend-dot" style="background:#b8860b"></div> ⭐ Étoilés Michelin</div>
  <div class="legend-row"><div class="legend-dot" style="background:#991b1b"></div> 🍽️ Restaurants</div>
  <div class="legend-row"><div class="legend-dot" style="background:#0ea5e9"></div> 🏛️ Halles Paul Bocuse</div>
  <div class="legend-row"><div class="legend-dot" style="background:#374151"></div> 🚇 Métro & Gares</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>

// =====================
// CARTE
// =====================
var map = L.map('map', { zoomControl: true });
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// =====================
// ICÔNES
// =====================
function makeIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="
      width:14px;height:14px;
      background:${color};
      border:2.5px solid white;
      border-radius:50%;
      box-shadow:0 2px 8px rgba(0,0,0,0.3);
    "></div>`,
    iconSize: [14,14],
    iconAnchor: [7,7],
    popupAnchor: [0,-10]
  });
}

var iconCulture    = makeIcon('#1a56a0');
var iconPatrimoine = makeIcon('#166534');
var iconEtoiles    = makeIcon('#b8860b');
var iconRestaurants = makeIcon('#991b1b');
var iconHalles     = makeIcon('#0ea5e9');

function makeMetroIcon(color, letter) {
  return L.divIcon({
    className: '',
    html: `<div style="
      width:18px;height:18px;
      background:${color};
      border:2px solid white;
      border-radius:4px;
      box-shadow:0 2px 8px rgba(0,0,0,0.3);
      display:flex;align-items:center;justify-content:center;
      font-size:9px;font-weight:700;color:white;
      font-family:sans-serif;
    ">${letter}</div>`,
    iconSize: [18,18],
    iconAnchor: [9,9],
    popupAnchor: [0,-12]
  });
}

function makeGareIcon() {
  return L.divIcon({
    className: '',
    html: `<div style="
      width:20px;height:20px;
      background:#1f2937;
      border:2px solid white;
      border-radius:50%;
      box-shadow:0 2px 8px rgba(0,0,0,0.4);
      display:flex;align-items:center;justify-content:center;
      font-size:11px;color:white;
    ">🚆</div>`,
    iconSize: [20,20],
    iconAnchor: [10,10],
    popupAnchor: [0,-12]
  });
}

var iconMetroA = makeMetroIcon('#e63946','A');
var iconMetroB = makeMetroIcon('#457b9d','B');
var iconMetroC = makeMetroIcon('#f4a261','C');
var iconMetroD = makeMetroIcon('#2a9d8f','D');
var iconGare   = makeGareIcon();

var dataTransports = [
  // === GARES ===
  { coords:[45.7495,4.8275], nom:"Gare de Lyon-Perrache", cat:"Transport", type:"Gare SNCF — Lignes TGV, TER, Intercités", adresse:"Place Carnot, 69002 Lyon", note:"Terminus de la ligne A du métro. Connexion Rhônexpress pour l'aéroport St-Exupéry.", icone: iconGare },
  { coords:[45.7604,4.8598], nom:"Gare de Lyon-Part-Dieu", cat:"Transport", type:"Gare SNCF — Lignes TGV, TER, Intercités", adresse:"5 Place Charles Béraudier, 69003 Lyon", note:"Principale gare TGV de Lyon. Accès direct métro B et D, et Rhônexpress aéroport.", icone: iconGare },

  // === LIGNE A (rouge) ===

  { coords:[45.7498,4.8298], nom:"Ampère — Victor Hugo — Métro A", cat:"Transport", type:"Ligne A", adresse:"Place Ampère, 69002 Lyon", icone: iconMetroA },
  { coords:[45.7578,4.8323], nom:"Bellecour — Métro A & D", cat:"Transport", type:"Ligne A & D (correspondance)", adresse:"Place Bellecour, 69002 Lyon", note:"Correspondance lignes A et D. Cœur de la Presqu'île.", icone: iconMetroA },

  { coords:[45.7697,4.8370], nom:"Foch — Métro A", cat:"Transport", type:"Ligne A", adresse:"Avenue Foch, 69006 Lyon", icone: iconMetroA },
  { coords:[45.7712,4.8408], nom:"Masséna — Métro A", cat:"Transport", type:"Ligne A", adresse:"Cours Franklin Roosevelt, 69006 Lyon", icone: iconMetroA },
  { coords:[45.7718,4.8468], nom:"Charpennes — Charles Hérnu — Métro A & B", cat:"Transport", type:"Ligne A & B (correspondance)", adresse:"Cours Émile Zola, 69100 Villeurbanne", note:"Grande correspondance A et B à Villeurbanne.", icone: iconMetroA },
  { coords:[45.7704,4.8553], nom:"République — Villeurbanne — Métro A", cat:"Transport", type:"Ligne A", adresse:"Cours Émile Zola, 69100 Villeurbanne", icone: iconMetroA },
  { coords:[45.7688,4.8626], nom:"Gratte-Ciel — Métro A", cat:"Transport", type:"Ligne A", adresse:"Cours Henri Barbusse, 69100 Villeurbanne", icone: iconMetroA },
  { coords:[45.7683,4.8700], nom:"Laurent Bonnevay — Métro A", cat:"Transport", type:"Ligne A", adresse:"Boulevard Laurent Bonnevay, 69100 Villeurbanne", icone: iconMetroA },
  { coords:[45.7696,4.8809], nom:"Vaulx-en-Velin — La Soie — Métro A", cat:"Transport", type:"Ligne A — Terminus Est", adresse:"Avenue de la Soie, 69120 Vaulx-en-Velin", icone: iconMetroA },

  // === LIGNE B (bleu) ===
  { coords:[45.7718,4.8468], nom:"Charpennes — Métro B", cat:"Transport", type:"Ligne B", adresse:"Cours Émile Zola, 69100 Villeurbanne", icone: iconMetroB },
  { coords:[45.7678,4.8467], nom:"Part-Dieu — Métro B & D", cat:"Transport", type:"Ligne B & D (correspondance)", adresse:"Rue Garibaldi, 69003 Lyon", note:"Accès direct à la gare Part-Dieu et au centre commercial.", icone: iconMetroB },
  { coords:[45.7636,4.8470], nom:"Saxe — Gambetta — Métro B & D", cat:"Transport", type:"Ligne B & D (correspondance)", adresse:"Place du Général Brosset, 69003 Lyon", icone: iconMetroB },
  { coords:[45.7578,4.8323], nom:"Bellecour — Métro B", cat:"Transport", type:"Ligne B", adresse:"Place Bellecour, 69002 Lyon", icone: iconMetroB },
  { coords:[45.7540,4.8305], nom:"Minimes — Louis Pradel — Métro B", cat:"Transport", type:"Ligne B", adresse:"Rue des Minimes, 69002 Lyon", icone: iconMetroB },
  { coords:[45.7495,4.8275], nom:"Perrache — Métro B", cat:"Transport", type:"Ligne B", adresse:"Place Carnot, 69002 Lyon", icone: iconMetroB },
  { coords:[45.7413,4.8258], nom:"Confluence — Métro B", cat:"Transport", type:"Ligne B — Terminus Sud", adresse:"Rue Casimir Périer, 69002 Lyon", note:"Accès direct au Musée des Confluences.", icone: iconMetroB },

  // === LIGNE C (orange) ===
  { coords:[45.7677,4.8340], nom:"Hôtel de Ville — Métro C", cat:"Transport", type:"Ligne C", adresse:"Place de la Comédie, 69001 Lyon", icone: iconMetroC },
  { coords:[45.7683,4.8310], nom:"Croix-Paquet — Métro C", cat:"Transport", type:"Ligne C", adresse:"Place Croix-Paquet, 69001 Lyon", note:"Début de la section à crémaillère. Entrée des pentes de la Croix-Rousse.", icone: iconMetroC },
  { coords:[45.7726,4.8296], nom:"Croix-Rousse — Métro C", cat:"Transport", type:"Ligne C", adresse:"Boulevard de la Croix-Rousse, 69004 Lyon", icone: iconMetroC },
  { coords:[45.7770,4.8295], nom:"Hénon — Métro C", cat:"Transport", type:"Ligne C", adresse:"Rue Hénon, 69004 Lyon", icone: iconMetroC },
  { coords:[45.7840,4.8305], nom:"Cuire — Métro C", cat:"Transport", type:"Ligne C — Terminus Nord", adresse:"Avenue des Canuts, 69300 Caluire-et-Cuire", icone: iconMetroC },

  // === LIGNE D (vert) ===
  { coords:[45.7728,4.8066], nom:"Gare de Vaise — Métro D", cat:"Transport", type:"Ligne D — Terminus Nord-Ouest", adresse:"Rue du Docteur Horand, 69009 Lyon", icone: iconMetroD },
  { coords:[45.7707,4.8130], nom:"Valmy — Métro D", cat:"Transport", type:"Ligne D", adresse:"Rue Valmy, 69009 Lyon", icone: iconMetroD },
  { coords:[45.7678,4.8202], nom:"Gorge de Loup — Métro D", cat:"Transport", type:"Ligne D", adresse:"Avenue du 11 Novembre 1918, 69009 Lyon", icone: iconMetroD },
  { coords:[45.7651,4.8259], nom:"Fourvière — Métro D", cat:"Transport", type:"Ligne D", adresse:"Tunnel de Fourvière, 69005 Lyon", note:"Sous la colline de Fourvière. Sortie idéale pour le Vieux-Lyon.", icone: iconMetroD },

  { coords:[45.7540,4.8305], nom:"Guillotière — Métro D", cat:"Transport", type:"Ligne D", adresse:"Place Gabriel Péri, 69007 Lyon", icone: iconMetroD },

// =====================
// POPUP BUILDER
// =====================
function ico(d) {
  const icons = {
    adresse: `<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>`,
    tel: `<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.8 19.79 19.79 0 01.03 1.19 2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>`,
    info: `<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
    horaires: `<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`
  };
  return icons[d] || '';
}

function buildPopup(o) {
  const catColors = { 'Culture': '#1a56a0', 'Patrimoine': '#166534', 'Étoilé': '#b8860b', 'Bib Gourmand': '#991b1b', 'Bouchon': '#991b1b', 'Bocuse': '#991b1b', 'Transport': '#374151' };
  const color = catColors[o.cat] || '#333';
  let html = `<div class="popup-inner">
    <div class="popup-header">
      <div class="popup-category" style="color:${color}">${o.cat}</div>
      <div class="popup-name">${o.nom}</div>
    </div>
    <div class="popup-body">`;
  if (o.adresse) html += `<div class="popup-row">${ico('adresse')}<span>${o.adresse}</span></div>`;
  if (o.tel)     html += `<div class="popup-row">${ico('tel')}<span>${o.tel}</span></div>`;
  if (o.horaires)html += `<div class="popup-row">${ico('horaires')}<span>${o.horaires}</span></div>`;
  if (o.type)    html += `<div class="popup-row">${ico('info')}<span>${o.type}</span></div>`;
  if (o.note)    html += `<div class="popup-note">💬 ${o.note}</div>`;
  html += `</div></div>`;
  return html;
}

// =====================
// DONNÉES
// =====================

// =====================
// LAYERS & MARKERS
// =====================
var layers = {
  culture: L.layerGroup(),
  patrimoine: L.layerGroup(),
  etoiles: L.layerGroup(),
  restaurants: L.layerGroup(),
  halles: L.layerGroup(),
  transports: L.layerGroup()
};

Object.values(layers).forEach(function(l) { l.addTo(map); });

// =====================
// GEOCODAGE AUTOMATIQUE
// =====================
// Indicateur de chargement
var loadingDiv = document.createElement('div');
loadingDiv.id = 'loading';
loadingDiv.style.cssText = 'position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:2000;background:white;padding:10px 20px;border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,0.15);font-family:"DM Sans",sans-serif;font-size:13px;color:#0f1f3d;display:flex;align-items:center;gap:8px;';
loadingDiv.innerHTML = '<div style="width:14px;height:14px;border:2px solid #e8edf5;border-top-color:#1a56a0;border-radius:50%;animation:spin 0.8s linear infinite"></div> Chargement des lieux…';
document.body.appendChild(loadingDiv);

var style = document.createElement('style');
style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
document.head.appendChild(style);

// File d'attente pour respecter les limites Nominatim (1 req/sec)
var geocodeQueue = [];
var geocodeTotal = 0;
var geocodeDone = 0;

var allSets = [
  { data: dataCulture,    layer: layers.culture,      icon: iconCulture },
  { data: dataPatrimoine, layer: layers.patrimoine,    icon: iconPatrimoine },
  { data: dataEtoiles,    layer: layers.etoiles,       icon: iconEtoiles },
  { data: dataBib,        layer: layers.restaurants,   icon: iconRestaurants },
  { data: dataBouchons,   layer: layers.restaurants,   icon: iconRestaurants },
  { data: dataBocuse,     layer: layers.restaurants,   icon: iconRestaurants },
  { data: dataHalles,     layer: layers.halles,        icon: iconHalles },
];

// Les transports ont une icône par station — traitement séparé
dataTransports.forEach(function(o) {
  L.marker(o.coords, { icon: o.icone }).bindPopup(buildPopup(o), {maxWidth:260}).addTo(layers.transports);
});
layers.transports.addTo(map);

allSets.forEach(function(set) {
  set.data.forEach(function(o) {
    geocodeQueue.push({ o: o, layer: set.layer, icon: set.icon });
  });
});

geocodeTotal = geocodeQueue.length;

function processNext() {
  if (geocodeQueue.length === 0) {
    loadingDiv.remove();
    return;
  }

  var item = geocodeQueue.shift();
  var o = item.o;
  var adresse = o.adresse || '';

  // Si pas d'adresse, utiliser les coords existantes directement
  if (!adresse) {
    if (o.coords) {
      L.marker(o.coords, { icon: item.icon }).bindPopup(buildPopup(o), {maxWidth:280}).addTo(item.layer);
    }
    geocodeDone++;
    updateLoading();
    setTimeout(processNext, 0);
    return;
  }

  var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(adresse);

  fetch(url, { headers: { 'Accept-Language': 'fr', 'User-Agent': 'LyonConciergeApp/2.0' } })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.length > 0) {
        var lat = parseFloat(data[0].lat);
        var lon = parseFloat(data[0].lon);
        L.marker([lat, lon], { icon: item.icon }).bindPopup(buildPopup(o), {maxWidth:280}).addTo(item.layer);
      } else if (o.coords) {
        // Fallback sur les coords existantes si géocodage échoue
        L.marker(o.coords, { icon: item.icon }).bindPopup(buildPopup(o), {maxWidth:280}).addTo(item.layer);
      }
    })
    .catch(function() {
      if (o.coords) {
        L.marker(o.coords, { icon: item.icon }).bindPopup(buildPopup(o), {maxWidth:280}).addTo(item.layer);
      }
    })
    .finally(function() {
      geocodeDone++;
      updateLoading();
      setTimeout(processNext, 1100); // 1.1 sec entre chaque requête
    });
}

function updateLoading() {
  var pct = Math.round((geocodeDone / geocodeTotal) * 100);
  if (loadingDiv.parentNode) {
    loadingDiv.innerHTML = '<div style="width:14px;height:14px;border:2px solid #e8edf5;border-top-color:#1a56a0;border-radius:50%;animation:spin 0.8s linear infinite"></div> Chargement des lieux… ' + geocodeDone + '/' + geocodeTotal;
  }
}

// Lancer la file avec un léger délai
setTimeout(processNext, 500);

// =====================
// FILTRES
// =====================
var activeFilters = new Set(['tous']);

document.querySelectorAll('.filter-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var cat = btn.dataset.cat;

    if (cat === 'tous') {
      activeFilters = new Set(['tous']);
      document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      Object.values(layers).forEach(function(l) { l.addTo(map); });
      return;
    }

    document.querySelector('[data-cat="tous"]').classList.remove('active');
    activeFilters.delete('tous');

    if (btn.classList.contains('active')) {
      btn.classList.remove('active');
      activeFilters.delete(cat);
      if (layers[cat]) map.removeLayer(layers[cat]);
    } else {
      btn.classList.add('active');
      activeFilters.add(cat);
      if (layers[cat]) layers[cat].addTo(map);
    }

    if (activeFilters.size === 0) {
      document.querySelector('[data-cat="tous"]').click();
    }
  });
});

// =====================
// GÉOLOCALISATION
// =====================
var myLocationMarker = null;

function geolocate() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(function(pos) {
    var latlng = [pos.coords.latitude, pos.coords.longitude];
    if (myLocationMarker) map.removeLayer(myLocationMarker);
    myLocationMarker = L.marker(latlng, {
      icon: L.divIcon({
        className: '',
        html: '<div class="my-location-marker"></div>',
        iconSize: [18,18], iconAnchor: [9,9]
      })
    }).addTo(map).bindPopup('<b>📍 Vous êtes ici</b>').openPopup();
    map.setView(latlng, 15);
  }, function() {
    map.setView([45.75914, 4.82306], 14);
  });
}

document.getElementById('geoBtn').addEventListener('click', geolocate);

// Init : centrer sur Lyon, puis tenter géoloc
map.setView([45.7600, 4.8300], 14);
geolocate();

</script>
